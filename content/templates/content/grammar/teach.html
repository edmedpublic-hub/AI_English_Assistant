{% extends "base.html" %}

{% block content %}
<div class="grammar-teach-wrapper">
  
  <nav class="breadcrumb-nav" style="margin-bottom: 20px;">
    <a href="{% url 'content:chunk_grammar' lesson.id chunk.id %}" style="text-decoration: none; color: #3498db; font-weight: 500;">
      &larr; Back to Grammar List
    </a>
  </nav>

  <header class="teach-header">
    <h1 class="page-title">Grammar Point: {{ point.title }}</h1>
    <p class="meta-info">
      <strong>Lesson:</strong> {{ lesson.title }} | <strong>Chunk:</strong> {{ chunk.title }}
    </p>
  </header>

  <section class="grammar-explanation card" style="margin-top: 20px; padding: 20px; border: 1px solid #eee; border-radius: 8px;">
    <h3>Explanation</h3>
    <p>{{ point.explanation|linebreaks }}</p>
  </section>

  <section class="grammar-examples card" style="margin-top: 20px; padding: 20px; border: 1px solid #eef2f7; background-color: #f8f9fa; border-radius: 8px;">
    <h3>Examples</h3>
    <div class="example-box">
      {{ point.examples|linebreaks }}
    </div>
  </section>

  <hr style="margin: 30px 0;">

  <div class="action-footer" style="display: flex; gap: 15px; align-items: center;">
    <a href="{% url 'grammar:exercise' lesson.id chunk.id point.id %}" class="btn-primary" style="padding: 12px 24px; background: #2ecc71; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
      Start Practice &rarr;
    </a>
    
    <a href="{% url 'content:chunk_grammar' lesson.id chunk.id %}" class="btn-secondary" style="color: #666; text-decoration: none;">
      Maybe Later
    </a>
  </div>

</div>
{% endblock %}
