{# templates/registration/login.html #}

{% extends "base.html" %}

{% block title %}Login — AI English Assistant{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">

    <div class="card shadow-sm mt-4">
      <div class="card-body p-4">

        <h1 class="h4 fw-bold text-center mb-4">Sign In</h1>

        {% if form.errors %}
          <div class="alert alert-danger">
            Invalid username or password. Please try again.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">

          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Username</label>
            <input type="text"
                   name="username"
                   id="id_username"
                   class="form-control"
                   autofocus
                   required>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Password</label>
            <input type="password"
                   name="password"
                   id="id_password"
                   class="form-control"
                   required>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary">
              Sign In
            </button>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>
{% endblock %}
